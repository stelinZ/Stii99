name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'SonyPods_v1.2_Source.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded source archive
        shell: bash
        run: |
          mkdir -p source
          unzip -q SonyPods_v1.2_Source.zip -d source
          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/source" -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then PROJECT_DIR="$(find "$GITHUB_WORKSPACE/source" -type f -name settings.gradle -print -quit | xargs -r dirname)"; fi
          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::No Gradle settings.gradle(.kts) found in the uploaded ZIP."
            find source -maxdepth 3 -type f | head -80
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project root: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate and install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK root: $SDK_ROOT"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK directory does not exist: $SDK_ROOT"
            ls -la /usr/local/lib/android /opt/android-sdk 2>/dev/null || true
            exit 1
          fi
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found under $SDK_ROOT"
            find "$SDK_ROOT" -maxdepth 4 -type d | head -100
            exit 1
          fi
          echo "Found sdkmanager: $SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Repair missing launcher color resource
        shell: bash
        run: |
          RES_DIR="$PROJECT_DIR/app/src/main/res"
          if [ ! -d "$RES_DIR" ]; then
            echo "::error::Android app resources directory not found: $RES_DIR"
            exit 1
          fi
          if ! grep -Rqs 'name=["'"'"']ic_bg["'"'"']' "$RES_DIR"/values* 2>/dev/null; then
            mkdir -p "$RES_DIR/values"
            cat > "$RES_DIR/values/sonypods_ci_colors.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_bg">#101820</color>
          </resources>
          XML
            echo "Added missing ic_bg launcher background color."
          else
            echo "ic_bg color resource already exists."
          fi

      - name: Build debug APK
        shell: bash
        run: |
          gradle -p "$PROJECT_DIR" clean assembleDebug --no-daemon --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          find "$PROJECT_DIR" -type f -path "*/build/outputs/apk/debug/*.apk" -exec cp {} "$GITHUB_WORKSPACE/apk-output/" +
          if [ -z "$(find "$GITHUB_WORKSPACE/apk-output" -name '*.apk' -print -quit)" ]; then
            echo "::error::Gradle completed but no debug APK was found."
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SonyPods-debug-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 14
