name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'SonyPods_v2.0_3D.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and normalize uploaded source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          python3 - <<'PY'
          import pathlib, zipfile
          archive = pathlib.Path("SonyPods_v2.0_3D.zip")
          destination = pathlib.Path("source").resolve()
          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  name = item.filename.replace("\", "/").lstrip("/")
                  target = (destination / name).resolve()
                  if target != destination and destination not in target.parents:
                      raise SystemExit(f"Unsafe archive path: {item.filename}")
                  if item.is_dir() or name.endswith("/"):
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with z.open(item) as src, target.open("wb") as dst:
                          dst.write(src.read())
          PY
          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/source" -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then PROJECT_DIR="$(find "$GITHUB_WORKSPACE/source" -type f -name settings.gradle -print -quit | xargs -r dirname)"; fi
          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::No Gradle settings.gradle(.kts) found in the uploaded ZIP."
            find source -maxdepth 5 -type f | head -100
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project root: $PROJECT_DIR"
          test -f "$PROJECT_DIR/app/src/main/assets/models/sony_wf1000xm5_complete.glb"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate and install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK root: $SDK_ROOT"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK directory does not exist: $SDK_ROOT"
            ls -la /usr/local/lib/android /opt/android-sdk 2>/dev/null || true
            exit 1
          fi
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found under $SDK_ROOT"
            find "$SDK_ROOT" -maxdepth 4 -type d | head -100
            exit 1
          fi
          echo "Found sdkmanager: $SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      - name: Fix 3D model loading and mobile WebView rendering
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR" <<'PY'
          import pathlib, sys
          root = pathlib.Path(sys.argv[1])
          viewer = root / "app/src/main/assets/viewer.html"
          s = viewer.read_text()

          s = s.replace(
              "#loading.hide{opacity:0;pointer-events:none}",
              "#loading.hide{opacity:0;pointer-events:none}\n#loadError{display:none;max-width:85%;padding:12px 16px;border:1px solid rgba(255,120,120,.28);border-radius:12px;background:rgba(20,12,16,.88);color:#ffd4d4;font:12px/1.45 sans-serif;text-align:center}\n#loadError.show{display:block}\n#loadError small{display:block;margin-top:6px;color:#d4aeb3;overflow-wrap:anywhere}"
          )
          s = s.replace(
              '<div id="loading"><div class="spinner"></div></div>',
              '<div id="loading"><div style="display:flex;flex-direction:column;align-items:center;gap:10px"><div class="spinner"></div><div style="color:#aeb6c8;font:11px sans-serif">Загрузка 3D-модели…</div><div id="loadError"></div></div></div>'
          )
          s = s.replace(
              "const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, powerPreference:'high-performance' });\nrenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));\nrenderer.setSize(window.innerWidth, window.innerHeight);",
              "const renderer = new THREE.WebGLRenderer({ antialias:false, alpha:true, powerPreference:'high-performance', stencil:false, depth:true });\nrenderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));\nrenderer.setSize(Math.max(1, container.clientWidth || window.innerWidth), Math.max(1, container.clientHeight || window.innerHeight));"
          )
          s = s.replace("renderer.shadowMap.enabled = true;\nrenderer.shadowMap.type = THREE.PCFSoftShadowMap;", "renderer.shadowMap.enabled = false; // Faster first frame on mobile.")
          old_loader = """new GLTFLoader().load('models/sony_wf1000xm5_complete.glb', gltf => {
              model = gltf.scene;
              model.traverse(ch => {
                  if(ch.isMesh){ ch.castShadow=true; ch.receiveShadow=true;
                      if(ch.material) ch.material.envMapIntensity=1.6;
                  }
              });
              model.traverse(n => {
                  if(n.name==='LidPivot') lidPivot=n;
                  if(n.name==='EarbudLeft') earbudLeft=n;
                  if(n.name==='EarbudRight') earbudRight=n;
              });
              model.position.set(0,-0.004,0);
              scene.add(model);
              document.getElementById('loading').classList.add('hide');
              document.getElementById('ui').classList.add('show');
              setTimeout(()=> playOpen(), 350);
          }, undefined, e => console.error('GLB load error',e));"""
          new_loader = """function showLoadError(error) {
              const box = document.getElementById('loadError');
              box.classList.add('show');
              box.innerHTML = 'Не удалось загрузить 3D-модель<small></small>';
              box.querySelector('small').textContent = String(error && (error.message || error.type) || error || 'Unknown error');
              console.error('[SonyPods] GLB load error:', error);
          }
          try {
              const modelUrl = new URL('models/sony_wf1000xm5_complete.glb', window.location.href).href;
              new GLTFLoader().load(modelUrl, gltf => {
                  try {
                      model = gltf.scene;
                      model.traverse(ch => {
                          if (ch.isMesh) {
                              ch.frustumCulled = false;
                              ch.castShadow = false;
                              ch.receiveShadow = false;
                              if (ch.material) {
                                  const mats = Array.isArray(ch.material) ? ch.material : [ch.material];
                                  mats.forEach(m => { if ('envMapIntensity' in m) m.envMapIntensity = 1.25; });
                              }
                          }
                      });
                      model.traverse(n => {
                          if (n.name === 'LidPivot') lidPivot = n;
                          if (n.name === 'EarbudLeft') earbudLeft = n;
                          if (n.name === 'EarbudRight') earbudRight = n;
                      });
                      scene.add(model);
                      const bounds = new THREE.Box3().setFromObject(model);
                      const size = bounds.getSize(new THREE.Vector3());
                      const center = bounds.getCenter(new THREE.Vector3());
                      const radius = Math.max(size.length() * 0.5, 0.005);
                      model.position.sub(center);
                      model.position.y -= 0.004;
                      const distance = Math.max(radius * 2.7, 0.055);
                      controls.target.set(0, 0, 0);
                      camera.position.set(distance * 0.18, distance * 0.55, distance * 2.15);
                      camera.near = Math.max(radius / 100, 0.0001);
                      camera.far = Math.max(radius * 100, 10);
                      camera.updateProjectionMatrix();
                      controls.minDistance = radius * 1.15;
                      controls.maxDistance = radius * 9;
                      controls.update();
                      defaultCamPos.copy(camera.position);
                      defaultTarget.copy(controls.target);
                      document.getElementById('loading').classList.add('hide');
                      document.getElementById('ui').classList.add('show');
                      if (window.Android && typeof window.Android.onSceneReady === 'function') window.Android.onSceneReady();
                      setTimeout(() => playOpen(), 120);
                      console.info('[SonyPods] 3D model ready', {url:modelUrl, size:size.toArray(), radius});
                  } catch (err) { showLoadError(err); }
              }, xhr => {
                  if (xhr && xhr.total) console.info('[SonyPods] model loading', Math.round(xhr.loaded / xhr.total * 100) + '%');
              }, showLoadError);
          } catch (err) { showLoadError(err); }"""
          if old_loader not in s:
              raise SystemExit("Expected original GLTF loader block was not found; refusing a blind patch.")
          s = s.replace(old_loader, new_loader)
          s = s.replace("window.addEventListener('load',()=>{if(window.Android) window.Android.onSceneReady()});",
                        "window.addEventListener('error', e => console.error('[SonyPods] JS error:', e.message, e.filename, e.lineno));\nwindow.addEventListener('unhandledrejection', e => console.error('[SonyPods] Promise error:', e.reason));")
          s = s.replace("camera.aspect=window.innerWidth/window.innerHeight;\n    camera.updateProjectionMatrix();\n    renderer.setSize(window.innerWidth,window.innerHeight);",
                        "const w=Math.max(1,container.clientWidth||window.innerWidth), h=Math.max(1,container.clientHeight||window.innerHeight);\n    camera.aspect=w/h;\n    camera.updateProjectionMatrix();\n    renderer.setSize(w,h);")
          viewer.write_text(s)

          kotlin = root / "app/src/main/java/app/sonypods/Pods3DCardView.kt"
          k = kotlin.read_text()
          k = k.replace(
              "settings.allowFileAccess = true\n            settings.mediaPlaybackRequiresUserGesture = false",
              "settings.allowFileAccess = true\n            // GLTFLoader uses fetch() for the local GLB. WebView blocks file-origin requests by default.\n            @Suppress(\"DEPRECATION\")\n            settings.allowFileAccessFromFileURLs = true\n            @Suppress(\"DEPRECATION\")\n            settings.allowUniversalAccessFromFileURLs = true\n            settings.mixedContentMode = android.webkit.WebSettings.MIXED_CONTENT_ALWAYS_ALLOW\n            settings.cacheMode = android.webkit.WebSettings.LOAD_DEFAULT\n            settings.mediaPlaybackRequiresUserGesture = false"
          )
          k = k.replace(
              "webViewClient = WebViewClient()\n            webChromeClient = WebChromeClient()",
              """webViewClient = object : WebViewClient() {
                  override fun onReceivedError(view: WebView, request: android.webkit.WebResourceRequest, error: android.webkit.WebResourceError) {
                      super.onReceivedError(view, request, error)
                      android.util.Log.e("SonyPods3D", "Web resource failed: ${request.url} (${error.errorCode}) ${error.description}")
                  }
              }
              webChromeClient = object : WebChromeClient() {
                  override fun onConsoleMessage(message: android.webkit.ConsoleMessage): Boolean {
                      android.util.Log.d("SonyPods3D", "JS ${message.messageLevel()}: ${message.message()} (${message.sourceId()}:${message.lineNumber()})")
                      return true
                  }
              }
              setLayerType(View.LAYER_TYPE_HARDWARE, null)"""
          )
          k = k.replace(
              "sceneReady = true\n                        evaluateJavascript(\"sonyPodsApi.open()\", null)",
              "sceneReady = true\n                        android.util.Log.i(\"SonyPods3D\", \"Three.js scene and GLB model are ready\")\n                        evaluateJavascript(\"if(window.sonyPodsApi){sonyPodsApi.open();true}else{false}\", null)"
          )
          if "allowFileAccessFromFileURLs" not in k or "onConsoleMessage" not in k:
              raise SystemExit("WebView patch did not apply completely.")
          kotlin.write_text(k)
          print("Patched WebView local-file fetch permissions, model-ready callback, adaptive camera framing, fast mobile rendering, and visible load errors.")
          PY

      - name: Repair missing launcher color resource
        shell: bash
        run: |
          RES_DIR="$PROJECT_DIR/app/src/main/res"
          if [ ! -d "$RES_DIR" ]; then
            echo "::error::Android app resources directory not found: $RES_DIR"
            exit 1
          fi
          if ! grep -Rqs 'name=["'\''"]ic_bg["'\''"]' "$RES_DIR"/values* 2>/dev/null; then
            mkdir -p "$RES_DIR/values"
            cat > "$RES_DIR/values/sonypods_ci_colors.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_bg">#101820</color>
          </resources>
          XML
            echo "Added missing ic_bg launcher background color."
          else
            echo "ic_bg color resource already exists."
          fi

      - name: Fix non-exhaustive popup view type handling
        shell: bash
        run: |
          set -euo pipefail
          FILE="$PROJECT_DIR/app/src/main/java/app/sonypods/PopupController.kt"
          python3 - "$FILE" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          lines = p.read_text().splitlines()
          matches = [i for i, line in enumerate(lines) if "is PodsCardView ->" in line]
          if len(matches) != 1:
              raise SystemExit(f"Expected one PodsCardView branch, found {len(matches)}")
          i = matches[0]
          indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
          if i + 1 < len(lines) and "else -> { dismiss() }" in lines[i + 1]:
              print("Fallback already present.")
          else:
              lines.insert(i + 1, indent + "else -> { dismiss() }")
              p.write_text("\n".join(lines) + "\n")
              print("Added exhaustive fallback branch to PopupController.")
          PY

      - name: Inspect Kotlin compile failure context
        shell: bash
        run: |
          set -euo pipefail
          FILE="$PROJECT_DIR/app/src/main/java/app/sonypods/PopupController.kt"
          echo "Inspecting $FILE"
          nl -ba "$FILE" | sed -n '1,120p'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" clean assembleDebug --no-daemon --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          while IFS= read -r -d '' apk; do
            cp "$apk" "$GITHUB_WORKSPACE/apk-output/"
          done < <(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -print0)
          if [ -z "$(find "$GITHUB_WORKSPACE/apk-output" -type f -name '*.apk' -print -quit)" ]; then
            echo "::error::Gradle completed but no debug APK was found."
            exit 1
          fi
          echo "APK files staged for upload:"
          ls -lh "$GITHUB_WORKSPACE/apk-output"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SonyPods-v2.0-3D-debug-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload extracted source for 3D viewer diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: SonyPods-v2.0-source-diagnostic
          path: |
            source/**/app/src/main/assets/**
            source/**/app/src/main/java/**
            source/**/app/src/main/res/**
            source/**/app/src/main/AndroidManifest.xml
          if-no-files-found: warn
          retention-days: 3
