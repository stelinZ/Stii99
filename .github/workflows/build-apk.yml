name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'SonyPods_v1.2_Source.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded source archive
        shell: bash
        run: |
          mkdir -p source
          unzip -q SonyPods_v1.2_Source.zip -d source
          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/source" -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then PROJECT_DIR="$(find "$GITHUB_WORKSPACE/source" -type f -name settings.gradle -print -quit | xargs -r dirname)"; fi
          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::No Gradle settings.gradle(.kts) found in the uploaded ZIP."
            find source -maxdepth 3 -type f | head -80
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project root: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "platforms;android-35" "platforms;android-36" "build-tools;34.0.0" "build-tools;35.0.0" "build-tools;36.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          gradle -p "$PROJECT_DIR" clean assembleDebug --no-daemon --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          find "$PROJECT_DIR" -type f -path "*/build/outputs/apk/debug/*.apk" -exec cp {} "$GITHUB_WORKSPACE/apk-output/" +
          if [ -z "$(find "$GITHUB_WORKSPACE/apk-output" -name '*.apk' -print -quit)" ]; then
            echo "::error::Gradle completed but no debug APK was found."
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SonyPods-debug-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 14
